<!-- Add this inside the <body>, replacing the previous booking form section -->
<section id="booking">
  <h2>Book a Session</h2>
  <form action="https://www.paypal.com/cgi-bin/webscr" method="post" target="_blank">
    <label for="name">Full Name:</label><br/>
    <input type="text" id="name" name="name" required/><br/><br/>

    <label for="email">Email:</label><br/>
    <input type="email" id="email" name="email" required/><br/><br/>

    <label for="service">Select Service:</label><br/>
    <select name="item_name">
      <option value="Swedish Massage - 60 min">Swedish Massage - $80</option>
      <option value="Deep Tissue Massage - 60 min">Deep Tissue Massage - $90</option>
      <option value="Aromatherapy - 60 min">Aromatherapy - $85</option>
    </select><br/><br/>

    <input type="hidden" name="business" value="your-paypal-email@example.com" />
    <input type="hidden" name="currency_code" value="USD" />
    <input type="hidden" name="cmd" value="_xclick" />

    <button class="book-btn" type="submit">Pay with PayPal</button>
  </form>
</section>
